appId: io.github.purrbeard.omoui.windows
productName: OmO UI Windows
copyright: Copyright © 2026 sigridjineth; Windows modifications by purrbeard
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
  - "!**/*.map"
asar: true
# node-pty ships N-API prebuilts; Electron loads them directly (verified by scripts/prove-pty.cjs).
npmRebuild: false
asarUnpack:
  - node_modules/node-pty/**
# The DSH MIT notice and the font license ship with every copy of the app (Contents/Resources).
extraResources:
  - from: dist-electron/tree-selection-extension.js
    to: tree-selection-extension.js
  - from: dist-electron/task-message-extension.js
    to: task-message-extension.js
  - from: build/icon.png
    to: icon.png
  - from: NOTICE
    to: NOTICE
  - from: LICENSE
    to: LICENSE
  - from: src/dsh/theme/Montserrat-OFL.txt
    to: Montserrat-OFL.txt
  - from: src/dsh/theme/Geist-OFL.txt
    to: Geist-OFL.txt
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: build/icon.icns
  darkModeSupport: true
  # No Developer ID certificate: "-" is electron-builder 26's explicit ad-hoc signing opt-in.
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    LSMinimumSystemVersion: "12.0"
dmg:
  title: OmO UI
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

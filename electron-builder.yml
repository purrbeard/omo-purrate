appId: io.github.purrbeard.omopurrate
productName: OmO UI Windows
copyright: Copyright © 2026 sigridjineth; Windows modifications by purrbeard
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
  - "!**/*.map"
asar: true
# node-pty ships N-API prebuilts; Electron loads them directly (verified by scripts/prove-pty.cjs).
npmRebuild: false
asarUnpack:
  - node_modules/node-pty/**
  # Worker threads load their script from disk, not from the archive.
  - dist-electron/history-worker.cjs
# The DSH MIT notice and the font license ship with every copy of the app (Contents/Resources).
extraResources:
  - from: dist-electron/tree-selection-extension.js
    to: tree-selection-extension.js
  - from: dist-electron/task-message-extension.js
    to: task-message-extension.js
  - from: build/icon.png
    to: icon.png
  - from: NOTICE
    to: NOTICE
  - from: LICENSE
    to: LICENSE
  - from: src/ui/theme/fonts/Geist-OFL.txt
    to: Geist-OFL.txt
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: build/icon.icns
  darkModeSupport: true
  # No Developer ID certificate: "-" is electron-builder 26's explicit ad-hoc signing opt-in.
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    LSMinimumSystemVersion: "12.0"
dmg:
  title: omo Purrate
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  # Pinned to the GUID earlier builds derived from their appId, so installed copies keep upgrading in place.
  guid: aa772115-6622-56c3-aa36-a066b758141e
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Shown name only; productName stays the install identity (folder, exe, userData, release asset names).
  shortcutName: omo Purrate
  uninstallDisplayName: omo Purrate
